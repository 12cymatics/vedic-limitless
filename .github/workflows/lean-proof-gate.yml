name: Lean proof gate

on:
  push:
    branches: [ main, "commercial/**" ]
  pull_request:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain pin
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake --version
      - name: Update pinned dependencies
        working-directory: lean
        shell: bash
        run: lake update
      - name: Build complete formal gate currently declared by the manifest
        working-directory: lean
        shell: bash
        run: lake build
      - name: Reject proof bypasses
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '\b(sorry|admit)\b|^[[:space:]]*axiom[[:space:]]' lean --include='*.lean'; then
            echo 'Proof bypass detected.' >&2
            exit 1
          fi
